[package]
name = "burrow"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "burrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset backs `app.security.assetProtocol` in tauri.conf.json. The two
# must agree or the build script rejects the config outright.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
blake3 = { version = "1.8.5", features = ["mmap", "rayon"] }
image = "0.25.10"
rayon = "1.12.0"
thiserror = "2.0.19"
dirs = "6.0.0"
webp = "0.3.1"
regex = "1.13.1"
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }

